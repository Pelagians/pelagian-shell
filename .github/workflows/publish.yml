name: Publish Pelagian Shell

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-pelagian-shell-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/pelagians/pelagian-shell
  DOCKER_METADATA_SHORT_SHA_LENGTH: 40

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt

      - name: Qualify source and reference runtime
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
          REVISION: ${{ github.sha }}
        run: |
          make check
          make container-smoke VERSION="$VERSION" REVISION="$REVISION"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Pelagian Shell
            org.opencontainers.image.description=Selkies/Labwc workspace substrate for Pelagian streamed workloads
            org.opencontainers.image.source=https://github.com/Pelagians/pelagian-shell
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish qualified image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=pelagian-shell
          cache-to: type=gha,mode=max,scope=pelagian-shell
          provenance: mode=max
          sbom: true

      - name: Verify published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          reference="${IMAGE}@${DIGEST}"
          docker pull "$reference"
          # The single-quoted expression is a Go template, not shell expansion.
          # shellcheck disable=SC2016
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$reference")" = "$REVISION"
          docker run --rm --entrypoint /usr/local/bin/pelagian-shellctl "$reference" status >/dev/null
          docker run --rm --entrypoint /usr/local/bin/pelagian-layoutd "$reference" status >/dev/null
          printf '## Published image\n\n- %s\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
