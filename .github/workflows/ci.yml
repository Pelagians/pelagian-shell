name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt
      - name: Check format, lint, unit tests, and runtime contract
        run: make check

  reference-runtime:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Build and smoke-test the reference Selkies/Labwc image
        run: make container-smoke

  rootless-podman:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install rootless Podman
        run: sudo apt-get update && sudo apt-get install --yes podman uidmap slirp4netns fuse-overlayfs
      - name: Prove rootless execution
        run: |
          test "$(id -u)" -ne 0
          podman info
      - name: Build and smoke-test without privileges
        run: ENGINE=podman make container-smoke
