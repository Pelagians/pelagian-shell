name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      consumer: ${{ steps.scope.outputs.consumer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select real consumer qualification
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=''
          if [[ "$EVENT" == pull_request ]]; then base="$PR_BASE"; fi
          if [[ "$EVENT" == push ]]; then base="$PUSH_BASE"; fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo 'consumer=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base...HEAD" > "$RUNNER_TEMP/changed-paths"
          # Source-only docs and the separately pinned conformance fixture do
          # not affect the production Shell image. Unknown paths retain the gate.
          if grep -Ev '^(docs/|tests/consumer-conformance/|README\.md$|\.gitignore$)' "$RUNNER_TEMP/changed-paths" | grep -q .; then
            echo 'consumer=true' >> "$GITHUB_OUTPUT"
          else
            echo 'consumer=false' >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check format, lint, unit tests, and runtime contract
        run: make check

  reference-runtime:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Build and smoke-test the reference Selkies/Labwc image
        run: make container-smoke

  rootless-podman:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install rootless Podman
        run: sudo apt-get update && sudo apt-get install --yes podman uidmap slirp4netns fuse-overlayfs
      - name: Prove rootless execution
        run: |
          test "$(id -u)" -ne 0
          podman info
      - name: Build and smoke-test without privileges
        run: ENGINE=podman make container-smoke
      - name: Regress rootless Podman with a relabeled /config bind mount
        run: ENGINE=podman bash -Eeuo pipefail tests/container-bind-mount-smoke.sh pelagian-shell:0.1.0

  hermes-consumer:
    needs: [check, changes]
    if: needs.changes.outputs.consumer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Grotto's consumer hook and real-window/keyring/restart smoke contract.
      GROTTO_COMMIT: e89c1214263b4bb7fe0b2525f8332d1a093926e1
      SHELL_IMAGE: localhost/pelagian-shell:candidate
      HERMES_IMAGE: localhost/pelagian-shell-hermes:qualification
      PELAGIAN_SHELL_CONFORMANCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out the pinned Grotto consumer
        uses: actions/checkout@v4
        with:
          repository: Pelagians/Grotto
          ref: ${{ env.GROTTO_COMMIT }}
          path: consumer
          persist-credentials: false
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build this Shell and the real Hermes consumer
        run: |
          set -euo pipefail
          make container-build IMAGE="$SHELL_IMAGE" REVISION="${{ github.event.pull_request.head.sha || github.sha }}"
          docker build -f consumer/Containerfile.hermes-desktop \
            --build-arg "PELAGIAN_SHELL_IMAGE=$SHELL_IMAGE" \
            --build-arg "GROTTO_BUILD_REVISION=$GROTTO_COMMIT" \
            -t "$HERMES_IMAGE" consumer
      - name: Qualify Hermes under Docker
        run: CONTAINER_ENGINE=docker GROTTO_HERMES_DESKTOP_IMAGE="$HERMES_IMAGE" consumer/tests/smoke-hermes-desktop.sh
      - name: Qualify the same Hermes image under rootless Podman
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman uidmap slirp4netns fuse-overlayfs
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          docker save "$HERMES_IMAGE" | podman load
          CONTAINER_ENGINE=podman GROTTO_HERMES_DESKTOP_IMAGE="$HERMES_IMAGE" consumer/tests/smoke-hermes-desktop.sh
