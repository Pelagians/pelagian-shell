[package]
name = "pelagian-layoutd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "pelagian_layoutd"
path = "src/lib.rs"

[[bin]]
name = "pelagian-layoutd"
path = "src/main.rs"

[dependencies]
pelagian-shellctl = { path = "../shellctl" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6"
